<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SERA Apply</title>
  <meta name="description" content="One application for universities in Tanzania. Built for Form Six leavers by SERA.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="assets/sera-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before the page draws, so it never flashes.
    try {
      var t = localStorage.getItem("sera-apply.theme");
      if (t === "dark" || t === "eyecare") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
